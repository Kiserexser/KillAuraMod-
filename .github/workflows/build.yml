name: Build Mod JAR
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      
      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew 2>/dev/null || true
          echo "#\!/bin/sh" > gradlew
          echo "java -jar gradle/wrapper/gradle-wrapper.jar \"\$@\"" >> gradlew
          chmod +x gradlew
      
      - name: Build
        run: ./gradlew build --no-daemon
      
      - uses: actions/upload-artifact@v4
        with:
          name: KillAuraMod-JAR
          path: build/libs/*.jar
